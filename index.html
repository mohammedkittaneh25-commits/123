<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffe6f0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      display: none;
      text-align: center;
    }

    .active {
      display: block;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff6fa5;
      color: white;
      margin-right: 20px;
    }

    #noBtn {
      position: absolute;
      background: #ccc;
    }

    /* Yes page */
    .sun-bg {
      position: fixed;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 60px;
      opacity: 0.15;
      pointer-events: none;
      animation: floatSun 6s ease-in-out infinite;
    }

    @keyframes floatSun {
      0% { transform: translateY(-50%) translateY(0); }
      50% { transform: translateY(-50%) translateY(-15px); }
      100% { transform: translateY(-50%) translateY(0); }
    }

    .sun-note {
      margin-top: 12px;
      font-size: 13px;
      color: #555;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Question Page -->
  <div id="questionPage" class="page active">
    <h1>Will u go out with me? 💕</h1>
    <button id="yesBtn" onclick="showYesPage()">Yes 💖</button>
    <button id="noBtn">No 🙈</button>
  </div>

  <!-- Yes Page -->
  <div id="yesPage" class="page">
    <div class="sun-bg">☀️</div>
    <h1>YAAAY!!! 🎉🥳</h1>
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWJ6b2VhZ2N1c2Z0b2I0dGZ1cGg3NnE1NnJmNnM4dWx6bXh0ZCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/26ufdipQqU2lhNA4g/giphy.gif" width="250">
    <p class="sun-note">
      This page is powered by the sun<br>
      Freckles may increase ☀️😌
    </p>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", moveNo);

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function showYesPage() {
      document.getElementById("questionPage").classList.remove("active");
      document.getElementById("yesPage").classList.add("active");
    }
  </script>

</body>
</html>
